# ============================================================
# 本文件内容是「server 块」，会被复制到容器的
# /etc/nginx/conf.d/default.conf。
#
# nginx 主配置 /etc/nginx/nginx.conf 里已经有：
#   include /etc/nginx/conf.d/*.conf;
# 所以只要把 server 块放进 conf.d 就能生效，
# 不需要（也不应该）去覆写主配置。
# ============================================================

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Vite 构建出来的静态资源文件名带内容 hash，内容变了文件名就变，
    # 所以可以放心让浏览器长期缓存。
    # 这条比下面的 location / 更具体，会优先匹配 /assets/ 开头的请求。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Vue Router 用的是 history 模式（createWebHistory），
    # /devices、/hello 这些路径在服务器上并不存在对应的文件。
    # try_files 的作用是：先找同名文件，再找同名目录，
    # 都找不到就回退到 index.html，把路由交给前端处理。
    # 没有这行的话，直接访问或刷新 /devices 会 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ============================================================
    # AI 流式接口：必须关掉 nginx 的响应缓冲
    #
    # 默认 proxy_buffering 是 on —— nginx 会尽量把后端响应攒满缓冲区
    # 再转发给浏览器。对于 SSE / 逐块输出的接口，这意味着
    # **流式会退化成"等全部生成完再一次性出现"**，页面看起来像卡住了。
    #
    # ⚠️ 每新增一个流式接口都要在这里补一条 —— 后端已经在响应里回了
    # X-Accel-Buffering: no，但两处都做才保险：nginx 配置文件是改的人
    # 容易忘的地方，而后端那个头一旦被某个中间件吃掉就没人兜底了。
    #
    # 目前有两个流式接口：/api/ai/chat 和 /api/diagnosis/stream
    #
    # 路径匹配上 nginx 取最长前缀，所以这两条会优先于下面的 /api。
    # 其它 /api 接口保持默认缓冲（普通 JSON 响应反而更适合缓冲，能减少网络往返）。
    # ============================================================
    location /api/ai/ {
        proxy_pass http://backend:8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;

        # 模型生成可能要几十秒到一两分钟，默认 60s 读超时会中途掐断
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 故障诊断的流式生成。和上面那条同样的处理，理由见上
    location /api/diagnosis/ {
        proxy_pass http://backend:8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 把 /api 开头的请求转发给 backend 容器。
    #
    # 这里的 backend 是 docker-compose 里的服务名，不是 localhost ——
    # 容器之间通过 Compose 创建的网络互相访问，用服务名做 DNS 解析。
    # 用 localhost 会指向 frontend 容器自己，必然失败。
    #
    # proxy_pass 后面「不带路径、也不带结尾斜杠」是关键：
    #   proxy_pass http://backend:8080;   → /api/devices 原样转发成 /api/devices  ✓
    #   proxy_pass http://backend:8080/;  → 结尾斜杠会把 location 匹配到的
    #                                        /api 前缀替换掉，变成 /devices，后端 404 ✗
    location /api {
        proxy_pass http://backend:8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 后端接口有超时限制（Axios 那边设的是 10 秒），
        # nginx 默认 60 秒，这里保持一致即可，无需特殊调整。
    }
}
