server:
  port: 8080

spring:
  application:
    name: device-management-system

  # ============================================================
  # 文件上传
  #
  # ★ 这里的大小上限**故意设得比 app.file.max-size-mb（10MB）大**。
  #
  # 原因：Spring 的 multipart 上限默认只有 **1MB**，一旦被它先拦下，
  # 抛的是 MaxUploadSizeExceededException，提示只能是笼统的"文件过大"，
  # 用户不知道到底多少才合适。把 Spring 这道闸放宽，
  # 真正的判断交给业务层（FileStorageServiceImpl），它给出的提示是
  # 「文件大小超过限制（最大 10 MB）」—— 明确、可操作。
  #
  # 所以这两处的数值是**配套的**，改一个要记得改另一个。
  # ============================================================
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB

  # ============================================================
  # 数据源
  #
  # ${VAR:默认值} 是 Spring 的属性占位符语法，冒号后面是找不到该变量时的兜底值。
  #   本地 IDEA 直接跑：不带环境变量，走默认值 localhost:3306 —— 就是本机的 MySQL
  #   Docker 里跑：docker-compose.yml 注入 DB_HOST=mysql 等，覆盖掉默认值
  #
  # 必须这么写的原因是：容器里的 localhost 指容器自己，不是宿主机。
  # backend 容器直接连 localhost:3306 会连到它自己身上，必然失败。
  # ============================================================
  datasource:
    url: "jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:device_db}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ============================================================
  # JPA / Hibernate
  # ============================================================
  jpa:
    hibernate:
      # update：启动时对比实体与表结构，自动建表、自动加字段（不会删列、不会改类型）。
      # 开发阶段省事，但生产环境要改成 validate 或 none。
      ddl-auto: update
    # 控制台打印 Hibernate 执行的 SQL，方便调试
    show-sql: true
    # 关闭 OSIV（Open Session In View）。
    # 默认开启时 Spring 会在整个 HTTP 请求期间保持 Session，虽然能掩盖
    # LazyInitializationException，但会让本该在 Service 层结束的数据访问拖到
    # 视图渲染阶段，也容易长时间占用数据库连接。
    open-in-view: false
    properties:
      hibernate:
        # 把 SQL 换行排版，配合上面的 show-sql 使用
        format_sql: true

  # ============================================================
  # Redis
  #
  # 给 application 里加了 spring-boot-starter-data-redis 依赖之后，
  # 这段配置才会真正生效（Spring Boot 会自动配好 RedisTemplate 和连接工厂）。
  # Lettuce 是懒连接，Redis 没起来也不会导致应用启动失败。
  # ============================================================
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# ============================================================
# JWT 配置（自定义前缀，不是 Spring 的标准配置项）
#
# secret 必须是至少 32 字节（256 位）的字符串，HS256 的硬性要求，
# 短了启动时 JwtUtil 会直接抛异常并告诉你当前长度。
# 下面这个默认值仅供本地开发，部署时必须用 JWT_SECRET 环境变量覆盖。
# ============================================================
app:
  jwt:
    secret: ${JWT_SECRET:fbTER7biIlO7t6wK+rWoY5lHd1l73QLMsyE06csKy+k=}
    # token 有效期，单位分钟
    expire-minutes: ${JWT_EXPIRE_MINUTES:120}
    issuer: device-management-system

  # ============================================================
  # AI 模型
  #
  # 分两组：chat（AI 助手 / 故障分析 / 诊断共用）和 embedding（知识库向量化）。
  # 两组**可以接不同的提供方** —— 对话用云端 API、嵌入用本机 Ollama
  # 是很常见的搭配（嵌入量大、按量计费不划算，而对话次数少、要质量）。
  #
  # 提供方可选：
  #   ollama  —— 本机 / 自建的 Ollama，用它的**原生接口**
  #   openai  —— 任何 OpenAI 兼容服务（DeepSeek、通义千问兼容模式、Kimi、智谱、
  #              硅基流动、vLLM、LM Studio、one-api 网关……），走 /v1/chat/completions
  #
  # ⚠️ provider / base-url / model 这三项**会被「系统设置 → AI 模型」里的值覆盖**。
  # 这里写的是兜底默认值：库里那一行被删掉、或留空时用它。
  # 改完设置页即时生效，不用重启、也不用来改这个文件。
  #
  # ⚠️ API Key **只从这个文件和环境变量读**，不进数据库、不出现在任何接口响应里。
  # 理由：进了库就要面对加密存储、掩码返回、日志脱敏、备份泄露、导出带出
  # 一长串问题，每一环漏一次密钥就没了。它和 JWT 密钥、数据库密码是一类东西。
  # ============================================================
  ai:
    # ---------- 对话模型 ----------
    chat:
      provider: ${AI_CHAT_PROVIDER:ollama}
      # 本机 Ollama 是 http://localhost:11434。
      #
      # ⚠️ 换成 openai 提供方时，这里要**填到版本段为止**（跟 OpenAI SDK 的
      # base_url 一个约定），客户端只往后拼 /chat/completions：
      #   DeepSeek   https://api.deepseek.com/v1
      #   通义千问   https://dashscope.aliyuncs.com/compatible-mode/v1
      #   Kimi       https://api.moonshot.cn/v1
      #   硅基流动   https://api.siliconflow.cn/v1
      #   LM Studio  http://localhost:1234/v1
      #   Ollama 的 OpenAI 端点  http://localhost:11434/v1
      # 少写 /v1 或重复写都会 404 —— 系统设置页的「测试连接」能立刻发现。
      base-url: ${AI_CHAT_BASE_URL:http://localhost:11434}
      model: ${AI_CHAT_MODEL:qwen2.5:3b}
      # 外部服务的密钥。本机 Ollama 不需要，留空即可
      api-key: ${AI_CHAT_API_KEY:}

      # 系统提示词：让模型的角色定位和这个项目一致
      system-prompt: >-
        你是设备管理系统内置的助手。回答请简洁、分点、用中文。
        涉及设备管理、状态流转（在线/离线/维修中/使用中）、借用归还、报修流程、
        资产编号与保修期等问题时，可以结合这些业务概念来回答。
        不确定的信息不要编造。

      # 生成随机度：0 最确定，1 最随机。小模型建议 0.5~0.8，太高会开始胡言乱语
      temperature: ${AI_CHAT_TEMPERATURE:0.7}
      max-tokens: ${AI_CHAT_MAX_TOKENS:1024}

      # 连接超时（秒）——只是建立 TCP 连接，很快
      connect-timeout-seconds: 10
      # 读超时（分钟）——等模型生成的总时间。小模型在 CPU 上生成 500 字
      # 可能要几十秒到一两分钟，给得太短会在生成到一半时被掐断
      read-timeout-minutes: ${AI_READ_TIMEOUT_MINUTES:5}
      # 最多允许模型"查几次数据库"。不设上限会陷入死循环
      max-tool-rounds: ${AI_MAX_TOOL_ROUNDS:3}

      # 故障分析：要的是稳定结论不是创意，输出结构固定、不需要很长
      analysis-temperature: 0.3
      analysis-max-tokens: ${AI_ANALYSIS_MAX_TOKENS:800}
      # 故障诊断同理
      diagnosis-temperature: 0.3
      diagnosis-max-tokens: ${AI_DIAG_MAX_TOKENS:900}

      # 首页 AI 摘要：也偏稳定，但比分析略活一点 —— 它输出的是一段给人读的话，
      # 太死板会写成"总数：8；正常：5"这种流水账。
      # max-tokens 刻意给得比其他几项都小：要求就是三五句话，
      # 给到 900 等于放任它把看板上的每个数字复述一遍，那这段摘要就没有存在价值了
      # （看板上本来就写着）。功能开关在「系统设置 → 首页看板」里（走 sys_config）
      digest-temperature: 0.4
      digest-max-tokens: ${AI_DIGEST_MAX_TOKENS:300}

    # ---------- 嵌入模型（知识库向量化）----------
    #
    # ⚠️ 换模型 = **已入库的向量全部失效**，需要对每份文档点一次「重新处理」。
    # 不同模型产出的向量不在同一个语义空间，混着比会得到毫无意义的分数，
    # 而且不报错 —— 这是这个项目里最隐蔽的一类故障。
    embedding:
      provider: ${AI_EMBED_PROVIDER:ollama}
      # 和对话一样：走 openai 提供方时要填到版本段为止
      base-url: ${AI_EMBED_BASE_URL:http://localhost:11434}
      # 本机 Ollama 用 nomic-embed-text —— **不在默认安装里**，
      # 要单独拉：ollama pull nomic-embed-text（约 270MB）
      # 换 openai 时填对应服务的模型名，例如 text-embedding-3-small、BAAI/bge-m3
      model: ${AI_EMBED_MODEL:nomic-embed-text}
      # 留空则回退用 chat 的那个 Key
      api-key: ${AI_EMBED_API_KEY:}

      # 一次请求嵌入多少个文本块。两家都支持批量，逐条请求会很慢
      batch-size: ${AI_EMBED_BATCH:16}
      # 单次嵌入请求的读超时（秒）。嵌入是纯前向计算，比对话快得多
      timeout-seconds: ${AI_EMBED_TIMEOUT:120}

  # ============================================================
  # 故障诊断（相似历史工单的检索参数）
  #
  # 注意这里是**词面匹配**不是语义检索，参数的含义和知识库那套不一样。
  # 为什么不给工单也建一套向量索引，见 SimilarCaseFinder 的类注释。
  # ============================================================
  diagnosis:
    # 检索知识库时取前几条片段
    knowledge-top-k: ${DIAG_KNOWLEDGE_TOPK:4}
    # 返回几条相似历史工单
    similar-case-top-k: ${DIAG_CASE_TOPK:3}
    # 相似案例只在最近多少天里找。不设窗口的话，
    # 五年前那台早就报废的同类设备会一直冒出来
    similar-case-window-days: ${DIAG_CASE_WINDOW_DAYS:1095}
    # 一次最多取多少条候选来打分（打分在内存里逐条算）
    similar-case-candidate-limit: ${DIAG_CASE_CANDIDATE_LIMIT:500}
    # 最低匹配度。0.3 是刻意留低的：「同一台设备以前出过的问题」
    # 即使文字完全不重合也有参考价值，而"同设备"的加成（0.35）本身就过线
    similar-case-min-score: ${DIAG_CASE_MIN_SCORE:0.3}

  # ============================================================
  # 附件存储
  #
  # 文件落在磁盘上，数据库只存元数据（见 entity/DeviceAttachment）。
  # upload-dir 默认是**运行目录下的 uploads**：
  #   - IDEA 里直接跑 → backend/backend/uploads
  #   - Docker 里跑   → 容器内的 /app/uploads，docker-compose 已挂成命名卷
  #
  # 注意它**不在 Web 静态资源路径下**，不会被自动暴露成 URL，
  # 下载必须走带鉴权的接口（/api/device-attachments/{id}/download）。
  # ============================================================
  file:
    upload-dir: ${UPLOAD_DIR:uploads}
    # 这个值要和 spring.servlet.multipart.max-file-size 配套看：前者必须更大
    max-size-mb: ${UPLOAD_MAX_SIZE_MB:10}
    # 扩展名白名单。故意**不含 svg / html** —— 它们能被浏览器当页面渲染，
    # 内嵌脚本就等于给上传者开了一个存储型 XSS 的口子
    allowed-extensions:
      - jpg
      - jpeg
      - png
      - gif
      - bmp
      - webp
      - pdf
      - doc
      - docx
      - xls
      - xlsx
      - ppt
      - pptx
      - txt
      - csv
      # 知识库要收 Markdown（技术文档常见格式）。md 是纯文本，
      # 浏览器不会把它当页面渲染，放在白名单里没有 XSS 风险
      - md

  # ============================================================
  # 知识库（RAG 的源文件与检索参数）
  #
  # 和 app.file.allowed-extensions 是两层不同的校验：
  # 那一层管"能不能安全地存在服务器上"，这一层管"能不能被解析成知识"。
  # 所以这里更窄 —— 只有能被读成文本的格式。
  # ============================================================
  knowledge:
    allowed-extensions:
      - pdf
      - txt
      - md
    # 每个文本块的目标字符数。中文按字符算，500 字大概 300 多个 token
    chunk-size: ${KNOWLEDGE_CHUNK_SIZE:500}
    # 相邻块的重叠字数。必须有：一段话被硬切在两块之间时，
    # 切点两侧各自都读不通，命中哪一边都拿不到完整意思
    chunk-overlap: ${KNOWLEDGE_CHUNK_OVERLAP:80}
    # 单文档最多切多少块，防止超大文件把库撑爆
    max-chunks-per-doc: ${KNOWLEDGE_MAX_CHUNKS:3000}
    # 检索默认返回几条
    top-k: ${KNOWLEDGE_TOP_K:5}
    #
    # 相似度门槛。没有它的话，问一个知识库里根本没写过的问题
    # 也会返回几条"最不相关"的片段，看起来像是找到了。
    #
    # ⚠️ 这个值和**嵌入模型强相关**，不能照搬：
    # nomic-embed-text 这类模型上，相关的一对通常 0.5~0.7、不相关的 0.1~0.35，
    # 所以 0.35 是个合适的默认值。换成别的模型（尤其是维度更低、
    # 或者中文语料训练不足的），整个分布会整体平移，这个值要跟着调。
    #
    # 怎么调：去「设备知识库」页的检索试验面板，问一个**你知道答案就在库里**的问题。
    # 如果返回"没有找到相关度达到 X 的内容（最相近的一段是 Y）"，
    # 而 Y 离 X 不远，就把 X 往下调到 Y 之下；Y 差得远就是库里确实没有。
    min-score: ${KNOWLEDGE_MIN_SCORE:0.35}

  # ============================================================
  # 维保
  # ============================================================
  maintenance:
    # 提前多少天算「即将到期」，用于维保页面的告警和首页看板的提醒。
    # 不同企业差别很大：精密设备可能要提前 60 天备件，普通设备提前 7 天就够
    warn-days: ${MAINTENANCE_WARN_DAYS:30}

  # ============================================================
  # 安全策略
  # ============================================================
  security:
    # 密码有效期（天）。到期后用户登录会被要求先改密码。
    # 设成 0 或负数表示**关闭过期策略**（老系统迁移过来时可以先用这个过渡）。
    #
    # 注意：加这个字段之前建的账号没有改密记录，它们一律按"没过期"处理 ——
    # 否则升级那一刻所有老用户一登录就被判定过期，全被挡在门外。
    password-valid-days: ${PASSWORD_VALID_DAYS:90}
