# ============================================================
# 设备管理系统 —— 全栈一键启动
#
#   docker compose up -d --build     启动全部
#   docker compose logs -f backend   看后端日志
#   docker compose down              停止（加 -v 会连数据卷一起删）
#
# 注意：不要和 docker/docker-compose.dev.yml 同时启动 ——
# 那个文件是「只起 mysql + redis，后端在 IDEA 里跑」的本地开发用配置，
# 两者都映射了宿主机的 3306 和 6379，同时跑会端口冲突。
# ============================================================

services:
  # ----------------------------------------------------------
  # 数据库
  # ----------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: dms-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: device_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    # 健康检查是给下面的 backend 用的：depends_on 的 service_healthy
    # 会等到这里通过才开始启动 backend。
    # 光写 depends_on 只能保证「容器启动了」，而 MySQL 从启动到能接受连接
    # 要十几秒（首次初始化更久），backend 会在建连接池时就失败退出。
    healthcheck:
      # 用 127.0.0.1 而不是 localhost：初始化阶段 MySQL 会先起一个只监听
      # unix socket 的临时实例，走 localhost 可能连上那个临时实例而误判就绪
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - dms-net

  # ----------------------------------------------------------
  # 缓存
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: dms-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - dms-net

  # ----------------------------------------------------------
  # 后端
  # ----------------------------------------------------------
  backend:
    build:
      # 注意路径是 backend/backend —— Maven 项目根（有 pom.xml 的那层）
      # 在 backend/ 的子目录里，这是解压时多套了一层导致的。
      context: ./backend/backend
      dockerfile: Dockerfile
    container_name: dms-backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 这些值会覆盖 application.yml 里 ${DB_HOST:localhost} 之类的默认值。
      # 容器里的 localhost 指容器自身，所以必须通过服务名走 Compose 网络。
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: device_db
      DB_USER: root
      DB_PASSWORD: root
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # Ollama 跑在 Windows 宿主机上，不在 Compose 网络里。
      # 容器内的 localhost 指容器自己，所以必须用 host.docker.internal ——
      # 这是 Docker Desktop 提供的一个特殊域名，解析到宿主机的地址。
      # （Linux 上原生 Docker 需要给 backend 加 extra_hosts 映射，Windows/Mac 不用。）
      #
      # ⚠️ 变量名跟着配置结构改过：以前是 OLLAMA_BASE_URL / OLLAMA_MODEL，
      # 现在按用途分成了 chat / embedding 两组（两组可以接不同的提供方）。
      # 用旧名字不会报错，只会**静默地用回默认值 localhost:11434** ——
      # 而容器里的 localhost 连不上宿主机，表现是"AI 功能全部连不上，
      # 但环境变量明明写了"。
      AI_CHAT_BASE_URL: http://host.docker.internal:11434
      AI_CHAT_MODEL: qwen2.5:3b
      # 嵌入模型走同一个地址。**这个模型不在 Ollama 默认安装里**，
      # 需要先在宿主机上执行：ollama pull nomic-embed-text
      AI_EMBED_BASE_URL: http://host.docker.internal:11434
      AI_EMBED_MODEL: nomic-embed-text
      # 用云端 API 时在这里注入密钥（不要写进 application.yml 后提交）：
      #   AI_CHAT_PROVIDER: openai
      #   AI_CHAT_API_KEY: sk-xxxx
      #   AI_CHAT_BASE_URL: https://api.deepseek.com
      #   AI_CHAT_MODEL: deepseek-chat
      # 附件存放目录。显式指定成绝对路径，不要依赖"运行目录"——
      # 镜像里 WORKDIR 是 /app，写死路径能让下面的卷映射一目了然，
      # 也避免以后改了 WORKDIR 导致文件和卷对不上。
      UPLOAD_DIR: /app/uploads
    volumes:
      # ★ 附件必须挂成卷。
      # 不挂的话文件只存在于容器可写层里，容器一重建（docker compose up --build）
      # 上传的说明书、照片就全没了，而数据库里的记录还在 ——
      # 表现是"附件列表有记录、点下载报文件不存在"。
      - uploads_data:/app/uploads
    ports:
      # 暴露到宿主机是为了方便直接用 Postman / curl 调接口，
      # 前端其实是通过 Compose 内部网络访问 backend:8080，不走这个端口。
      - "8080:8080"
    networks:
      - dms-net

  # ----------------------------------------------------------
  # 前端
  # ----------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dms-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - dms-net

volumes:
  mysql_data:
  # 附件文件卷。和 mysql_data 一样是命名卷，docker compose down -v 会一起删掉
  uploads_data:

networks:
  # 显式声明一个 bridge 网络。
  # 其实不写也会自动创建默认网络，效果一样；写出来是为了让
  # 「所有服务在同一网络下」这件事在文件里看得见 ——
  # 正因为同处一个网络，nginx 里的 http://backend:8080 才能解析到后端容器。
  dms-net:
    driver: bridge
